name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm nuxi build
        env:
          NITRO_PRESET: cloudflare-pages

      - name: Inject resource IDs
        run: |
          sed -i "s/PLACEHOLDER_DB_ID/${{ secrets.DB_DATABASE_ID }}/g" wrangler.toml
          sed -i "s/PLACEHOLDER_KV_ID/${{ secrets.CACHE_KV_ID }}/g" wrangler.toml
			- name: Debug wrangler.toml
        run: cat wrangler.toml
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
        env:
          API_BASE: "https://aifindr.org"
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          ADMIN_GITHUB_IDS: ${{ secrets.ADMIN_GITHUB_IDS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          LEMONSQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMONSQUEEZY_WEBHOOK_SECRET }}